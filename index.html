<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kan Hizmetleri ve Transfüzyon Ön Testi</title>
<style>
  :root {
    --primary: #6366f1; --primary-hover: #4f46e5;
    --bg: #f8fafc; --card: #ffffff; --text: #1e293b;
    --muted: #64748b; --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 15px;
  }
  .container {
    width: 100%; max-width: 680px; background: var(--card);
    border-radius: 24px; border: 1px solid var(--border);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,.08); overflow: hidden;
  }
  .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 24px 20px; text-align: center; }
  .header h1 { font-size: 19px; margin-bottom: 6px; }
  .header p { font-size: 13px; opacity: .9; }
  .progress { background: var(--border); height: 6px; }
  .progress-fill { height: 100%; width: 0; background: #34d399; transition: width .4s ease; }
  .content { padding: 24px 20px; }

  .question-meta {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--primary);
    background: #eef2ff; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: .8px;
  }
  .question-title { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: #f8fafc; border: 1px solid var(--border); border-radius: 12px;
    cursor: pointer; font-size: 13.5px; transition: all .2s;
  }
  .option:hover { border-color: var(--primary); background: #f5f3ff; }
  .option.selected { border-color: var(--primary); background: #eef2ff; color: var(--primary); font-weight: 600; }
  .option input { accent-color: var(--primary); transform: scale(1.2); }

  .nav { display: flex; gap: 12px; margin-top: 20px; }
  .btn {
    padding: 12px 20px; font-size: 14px; font-weight: 600; border: none;
    border-radius: 12px; cursor: pointer; transition: all .2s;
  }
  .btn-secondary { background: #f1f5f9; color: var(--muted); }
  .btn-secondary:hover { background: var(--border); color: var(--text); }
  .btn-primary { background: var(--primary); color: #fff; flex-grow: 1; box-shadow: 0 4px 12px rgba(99,102,241,.25); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .hidden { display: none !important; }

  .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 15px; }
  .toast { padding: 20px; border-radius: 14px; text-align: center; font-size: 14px; font-weight: 500; margin-top: 10px; }
  .toast.loading { background: #e0e7ff; color: #3730a3; }
  .toast.success { background: #d1fae5; color: #065f46; }
  .toast.error { background: #fee2e2; color: #991b1b; }

  @media (max-width: 480px) {
    body { padding: 10px; }
    .container { border-radius: 18px; }
    .content { padding: 16px 14px; }
    .question-title { font-size: 14px; }
    .option { font-size: 13px; padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Kan Hizmetleri ve Transfüzyon Ön Testi</h1>
    <p>Soruları yanıtlayarak ilerleyebilir, dilediğiniz soruyu boş bırakabilirsiniz.</p>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

  <div class="content">
    <div id="quiz">
      <div id="questionBox"></div>
      <div class="nav">
        <button type="button" class="btn btn-secondary hidden" id="prevBtn">Geri</button>
        <button type="button" class="btn btn-primary" id="nextBtn">Sonraki Soru</button>
      </div>
      <div class="hint">💡 Telefonda parmağınızla sağa/sola kaydırarak da geçiş yapabilirsiniz.</div>
    </div>
    <div id="toast" class="toast hidden"></div>
  </div>
</div>

<script>
// ====== AYARLAR ======
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz7zBKRI-fJ7yvPJQvyCbUqhKLfe6koq-MlGmfkkpNZ0fsyVYEn144yf4T9G7gp1i68/exec";

const questions = [
  { q: "Türkiye'de kan hizmet birimlerinin ruhsatlandırılması, ulusal standartlarının belirlenmesi ve tüm transfüzyon sisteminin denetlenmesinden sorumlu en üst yetkili otorite hangisidir?",
    o: ["Türk Kızılay", "T.C. Sağlık Bakanlığı", "Sosyal Güvenlik Kurumu (SGK)", "Türk Tabipleri Birliği (TTB)"] },
  { q: "Türkiye'deki bölgesel kan bankacılığı yapılanması kapsamında, ülke genelinde gönüllü ve düzenli kan bağışçısı kazanımı ile kan tedarik organizasyonunu yürütmekle yetkilendirilen kurum hangisidir?",
    o: ["Türk Kızılay", "Sağlık Bakanlığı", "Kızılay Hastaneleri", "Üniversite Hastaneleri"] },
  { q: "Bağışçılardan toplanan tam kanın eritrosit, trombosit ve taze donmuş plazma gibi bileşenlere ayrıştırıldığı ve mikrobiyolojik/immünohematolojik tarama testlerinin yapıldığı merkez hangisidir?",
    o: ["Transfüzyon Merkezi (TM)", "Kan Bağışı Merkezi (KBM)", "Bölge Kan Merkezi (BKM)", "Hastane Kan Bankası"] },
  { q: "Bölge Kan Merkezi'nin (BKM) görev ve yetki sınırları dikkate alındığında, aşağıdakilerden hangisi BKM'nin yetki alanı dışındadır (yapmadığı iştir)?",
    o: ["Kan bileşenlerini üretmek", "Kan testlerini (mikrobiyolojik ve immünohematolojik) yapmak", "Doğrudan hastalara kan transfüzyonu (nakli) uygulamak", "Bağışçılardan kan toplamak ve depolamak"] },
  { q: "Doğrudan Bölge Kan Merkezi'ne (BKM) bağlı olarak çalışan, toplumda kan bağışı bilinci oluşturan, bağışçı kabulü ve kan alma (flebotomi) süreçlerini yürüten birim hangisidir?",
    o: ["Kan Bağışı Merkezi (KBM)", "Transfüzyon Merkezi (TM)", "Sağlık Ocağı", "Acil Servis"] },
  { q: "Kan Bağışı Merkezlerinin (KBM) çalışma sınırları ve yetkileri ile ilgili aşağıdaki ifadelerden hangisi DOĞRUDUR?",
    o: ["Tam kan bağışı alır, ancak bileşen üretimi ve ileri testleri Bölge Kan Merkezi'ne (BKM) aktarır.", "Doğrudan hastaya kan transfüzyonu yaparlar.", "Sadece plazma ferezis işlemi gerçekleştirirler.", "Ruhsatları Sağlık Bakanlığı izni olmadan alınır."] },
  { q: "Hastaneler bünyesinde kurulan, BKM'den gelen kan bileşenlerini teslim alan, muhafaza eden ve hasta için transfüzyon öncesi uygunluk (cross-match) testlerini gerçekleştiren birim hangisidir?",
    o: ["Bölge Kan Merkezi (BKM)", "Kan Bağışı Merkezi (KBM)", "Transfüzyon Merkezi (TM)", "Mobil Kan Aracı"] },
  { q: "Bir hastane Transfüzyon Merkezi'nin (TM) yetki ve sorumluluk sınırları düşünüldüğünde, aşağıdakilerden hangisi TM'nin YAPMAMASI gereken / yetki dışı bir uygulamadır?",
    o: ["Hastaya uygun kan bulmak için cross-match yapmak", "Dışarıdan gelen bağışçılardan doğrudan tam kan bağışı toplamak", "Kan bileşenlerini uygun ısıda saklamak", "Transfüzyon reaksiyonlarını takip etmek"] },
  { q: "Transfüzyon Merkezlerinin (TM) kan bağışı kabul etme yetkisi hususundaki yasal kural ve sınır aşağıdakilerden hangisidir?",
    o: ["İstedikleri her zaman dışarıdan gönüllü bağışçı kabul edebilirler.", "Normal şartlarda bağışçıdan doğrudan alamazlar; yalnızca olağanüstü durumlarda ve koordinasyonla bağış kabul edebilirler.", "Her hastane kendi bağışçısını sınırsızca test edip kullanabilir.", "Kan bağışı toplamak TM'lerin asli görevidir."] },
  { q: "Kanın bağışçıdan alınıp hastaya uygulanmasına kadar geçen süreçte kan hizmet birimlerinin doğru hiyerarşik işleyiş sırası hangisidir?",
    o: ["Transfüzyon Merkezi -> Bölge Kan Merkezi -> Kan Bağışı Merkezi", "Kan Bağışı Merkezi -> Transfüzyon Merkezi -> Bölge Kan Merkezi", "Kan Bağışı Merkezi -> Bölge Kan Merkezi -> Transfüzyon Merkezi", "Bölge Kan Merkezi -> Transfüzyon Merkezi -> Kan Bağışı Merkezi"] }
];

// ====== DURUM ======
const total = questions.length;
const answers = new Array(total).fill(0);   // 0 = boş, 1-4 = seçilen şık
let current = 0;
let submitting = false;

const $ = id => document.getElementById(id);
const box = $("questionBox"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn");

// ====== SORU ÇİZİMİ ======
function render() {
  const item = questions[current];
  box.innerHTML = "";

  const meta = document.createElement("div");
  meta.className = "question-meta";
  meta.textContent = "Soru " + (current + 1) + " / " + total;

  const title = document.createElement("div");
  title.className = "question-title";
  title.textContent = item.q;

  const list = document.createElement("div");
  list.className = "options";

  item.o.forEach((text, i) => {
    const value = i + 1;
    const label = document.createElement("label");
    label.className = "option" + (answers[current] === value ? " selected" : "");

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "q" + current;
    input.checked = answers[current] === value;
    input.addEventListener("change", () => {
      answers[current] = value;
      list.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
      label.classList.add("selected");
    });

    const span = document.createElement("span");
    span.textContent = String.fromCharCode(65 + i) + ") " + text;

    label.append(input, span);
    list.appendChild(label);
  });

  box.append(meta, title, list);

  $("progressFill").style.width = ((current + 1) / total * 100) + "%";
  prevBtn.classList.toggle("hidden", current === 0);
  nextBtn.textContent = current === total - 1 ? "Testi Gönder" : "Sonraki Soru";
}

function go(step) {
  if (submitting) return;
  const next = current + step;
  if (next < 0 || next >= total) return;
  current = next;
  render();
}

prevBtn.addEventListener("click", () => go(-1));
nextBtn.addEventListener("click", () => {
  if (current === total - 1) submitQuiz();
  else go(1);
});

// ====== KAYDIRMA (sadece soru geçişi, son soruda göndermez) ======
let startX = 0;
box.addEventListener("touchstart", e => { startX = e.changedTouches[0].screenX; }, { passive: true });
box.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].screenX - startX;
  if (diff < -50) go(1);
  else if (diff > 50) go(-1);
}, { passive: true });

// ====== GÖNDERİM ======
function showToast(type, text) {
  const t = $("toast");
  t.className = "toast " + type;
  t.textContent = text;
}

async function getIp() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 4000);
  try {
    const res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
    if (!res.ok) return "Bilinmiyor";
    const data = await res.json();
    return data.ip || "Bilinmiyor";
  } catch (e) {
    return "Bilinmiyor";
  } finally {
    clearTimeout(timer);
  }
}

async function submitQuiz() {
  if (submitting) return;
  submitting = true;
  nextBtn.disabled = true;
  prevBtn.disabled = true;
  nextBtn.textContent = "Gönderiliyor...";
  showToast("loading", "Yanıtlarınız gönderiliyor, lütfen bekleyin...");

  try {
    const payload = { ipAddress: await getIp(), answers: answers.map(String) };

    // Content-Type text/plain: tarayıcı "basit istek" sayar, CORS ön kontrolü (preflight) yapılmaz.
    const response = await fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const result = await response.json();
    if (result.status !== "success") {
      throw new Error(result.message || "Kayıt başarısız.");
    }

    $("quiz").classList.add("hidden");
    $("progressFill").style.width = "100%";
    showToast("success", "Yanıtlarınız başarıyla kaydedildi. Teşekkürler!");

  } catch (err) {
    console.error("Gönderim hatası:", err);
    showToast("error", "Gönderim başarısız: " + err.message);
    submitting = false;
    nextBtn.disabled = false;
    prevBtn.disabled = false;
    nextBtn.textContent = "Tekrar Dene";
  }
}

render();
</script>
</body>
</html>
